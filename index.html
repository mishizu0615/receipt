<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4a7c59">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="領収書">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Co-Nook 領収書メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 左に入力フォーム、右に紙の領収書プレビュー。狭い画面ではプレビューが上。 */
:root{
  --bg:#eef1ec; --panel:#fbfcfa; --line:#d5dbd2; --fg:#1f2a22; --muted:#66725f;
  --accent:#4a7c59; --accent-ink:#ffffff; --accent-soft:#dff0e5; --warn:#a4562a;
  --ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --paper-font:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a16; --panel:#1c241f; --line:#2f3a32; --fg:#e6ece5; --muted:#99a596;
  --accent:#7fb38f; --accent-ink:#0f1a13; --accent-soft:#24382b; --warn:#e3a37a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a16; --panel:#1c241f; --line:#2f3a32; --fg:#e6ece5; --muted:#99a596;
  --accent:#7fb38f; --accent-ink:#0f1a13; --accent-soft:#24382b; --warn:#e3a37a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));margin:0;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em}
h1 small{font-size:12px;color:var(--muted);font-weight:500;margin-left:8px}
.no{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}.preview-col{order:-1}}
form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:18px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
legend{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--accent);margin-bottom:6px;padding:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row.r3{grid-template-columns:2fr 1fr}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input,select{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.amount input{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;font:inherit;font-size:13px;padding:8px 0;border:0;background:var(--bg);color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:13px}
.check input{width:auto}
.hint{font-size:12px;color:var(--muted);margin:0}
.hint.warn{color:var(--warn)}

.preview-col{display:flex;flex-direction:column;gap:12px;min-width:0;position:sticky;top:16px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;overflow:hidden}
.scaler{transform-origin:top left}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:14px;padding:11px 18px;border-radius:8px;border:1px solid var(--accent);cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:wait}
.status{font-size:12px;color:var(--muted);min-height:1.4em;margin:0}

/* ===== 領収書本体（紙なのでテーマに関係なく固定色） ===== */
.receipt{width:760px;height:470px;background:#fffefb;color:#1b1b1b;font-family:var(--paper-font);position:relative;
  padding:30px 40px 26px;border:1px solid #cfcac0;display:flex;flex-direction:column}
.receipt .top{display:flex;justify-content:space-between;align-items:flex-start}
.receipt .title{font-size:34px;font-weight:900;letter-spacing:.6em;margin:0 0 0 .3em;line-height:1}
.receipt .meta{font-size:12px;text-align:right;line-height:1.7;font-variant-numeric:tabular-nums}
.receipt .to{margin-top:22px;display:flex;align-items:baseline;gap:10px;border-bottom:1px solid #1b1b1b;width:58%;padding-bottom:4px}
.receipt .to .name{font-size:21px;font-weight:700;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.receipt .to .hon{font-size:16px}
.receipt .amt{margin:22px auto 0;width:78%;background:#f3f1ea;border-top:2px solid #1b1b1b;border-bottom:4px double #1b1b1b;
  display:flex;align-items:center;justify-content:center;gap:18px;padding:10px 0}
.receipt .amt .k{font-size:14px;letter-spacing:.3em}
.receipt .amt .v{font-size:36px;font-weight:900;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.receipt .tadashi{width:78%;margin:12px auto 0;font-size:14px;display:flex;gap:8px}
.receipt .tadashi span:last-child{border-bottom:1px solid #999;flex:1}
.receipt .ack{width:78%;margin:6px auto 0;font-size:13px}
.receipt .bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.receipt .breakdown{font-size:12px;border:1px solid #1b1b1b;border-collapse:collapse;font-variant-numeric:tabular-nums}
.receipt .breakdown th,.receipt .breakdown td{border:1px solid #1b1b1b;padding:3px 10px}
.receipt .breakdown th{font-weight:500;background:#f3f1ea;text-align:left}
.receipt .breakdown td{text-align:right;min-width:96px}
.receipt .pay{font-size:11px;margin-top:6px}
.receipt .stamp{width:62px;height:72px;border:1px dashed #888;font-size:10px;color:#777;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.4}
.receipt .issuer{position:relative;text-align:left;font-size:12px;line-height:1.65;padding-right:30px;min-width:250px}
.receipt .issuer .shop{font-size:16px;font-weight:700}
.receipt .seal{position:absolute;right:-6px;top:-14px;width:66px;height:66px;border:2.5px solid #c8322b;border-radius:50%;
  color:#c8322b;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;letter-spacing:.02em;
  transform:rotate(-8deg);opacity:.85;text-align:center;line-height:1.1;padding:6px;word-break:break-all}
.receipt .seal::after{content:"";position:absolute;inset:4px;border:1px solid #c8322b;border-radius:50%}

.modal{position:fixed;inset:0;background:rgba(10,14,11,.7);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal-inner{background:var(--panel);border-radius:10px;padding:16px;max-width:820px;width:100%;display:flex;flex-direction:column;gap:10px}
.modal img{width:100%;height:auto;border:1px solid var(--line)}
#capture{position:fixed;left:-12000px;top:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>領収書メーカー<small>入力 → 画像 / PDFで保存</small></h1>
    <div class="no" id="noLabel"></div>
  </header>

  <div class="grid">
    <form id="f" autocomplete="off">
      <fieldset>
        <legend>宛名・金額</legend>
        <div class="row r3">
          <label>宛名<input id="to" value="サンプル商事株式会社"></label>
          <label>敬称<select id="hon"><option>御中</option><option>様</option><option value="">なし</option></select></label>
        </div>
        <label class="amount">税込金額（円）<input id="amount" inputmode="numeric" value="12800"></label>
        <div>
          <label style="margin-bottom:4px">税率</label>
          <div class="seg" id="rateSeg">
            <button type="button" data-rate="10" aria-pressed="true">10%</button>
            <button type="button" data-rate="8" aria-pressed="false">8%（軽減）</button>
          </div>
        </div>
        <p class="hint" id="stampHint"></p>
      </fieldset>

      <fieldset>
        <legend>但し書き</legend>
        <label>但し<input id="memo" value="御飲食代として"></label>
        <div class="chips" id="memoChips">
          <button type="button">御飲食代として</button>
          <button type="button">お品代として</button>
          <button type="button">ケータリング代として</button>
          <button type="button">会場使用料として</button>
          <button type="button">研修費として</button>
          <button type="button">業務委託料として</button>
        </div>
        <div class="row">
          <label>支払方法<select id="pay"><option>現金</option><option>クレジットカード</option><option>QRコード決済</option><option>銀行振込</option></select></label>
          <label>発行日<input id="date" type="date"></label>
        </div>
        <label>No.<input id="no" inputmode="numeric"></label>
      </fieldset>

      <fieldset>
        <legend>発行者（この端末に保存）</legend>
        <label>店名・屋号<input id="shop" value="お野菜ダイニングバー Sora"></label>
        <label>住所<input id="addr" placeholder="広島県福山市…"></label>
        <div class="row">
          <label>電話<input id="tel" inputmode="tel" placeholder="084-…"></label>
          <label>登録番号<input id="reg" placeholder="T1234567890123"></label>
        </div>
        <div class="row">
          <label class="check"><input type="checkbox" id="sealOn" checked>印影を入れる</label>
          <label>印影の文字<input id="sealText" value="Sora" maxlength="6"></label>
        </div>
        <p class="hint">登録番号を入れるとインボイス（適格簡易請求書）の記載要件を満たす形になります。</p>
      </fieldset>
    </form>

    <div class="preview-col">
      <div class="stage" id="stage"><div class="scaler" id="scaler"><div class="receipt" id="receipt"></div></div></div>
      <div class="actions">
        <button class="btn" id="savePdf" type="button">PDFで保存</button>
        <button class="btn ghost" id="savePng" type="button">画像で保存</button>
        <button class="btn ghost" id="nextNo" type="button">次の番号へ</button>
      </div>
      <p class="status" id="status" role="status"></p>
    </div>
  </div>
</div>
<div id="capture"></div>
<div class="modal" id="modal" hidden><div class="modal-inner">
  <p class="hint" id="modalHint">できました。「共有・保存」から「ファイルに保存」やLINE・メールに送れます。</p>
  <img id="modalImg" alt="領収書の画像">
  <div class="actions">
    <button class="btn" id="shareBtn" type="button">共有・保存</button>
    <a class="btn ghost" id="dlLink" download style="text-decoration:none;text-align:center">ダウンロード</a>
    <button class="btn ghost" id="closeModal" type="button">閉じる</button>
  </div>
</div></div>

<script src="vendor/html2canvas.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const store = {
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const ISSUER = ["shop","addr","tel","reg","sealText"];
let rate = 10;

// 初期値
(function init(){
  const iss = store.get("issuer") || {};
  ISSUER.forEach(k => { if (iss[k] != null) $(k).value = iss[k]; });
  if (iss.sealOn != null) $("sealOn").checked = iss.sealOn;
  const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  $("date").value = d.toISOString().slice(0,10);
  $("no").value = String(store.get("lastNo") ? store.get("lastNo")+1 : 1).padStart(4,"0");
})();

const yen = n => n.toLocaleString("ja-JP");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function parseAmount(){ return parseInt(String($("amount").value).replace(/[^\d]/g,""),10) || 0; }
function jpDate(v){ if(!v) return ""; const [y,m,d]=v.split("-").map(Number); return `${y}年${m}月${d}日`; }

function calc(){
  const total = parseAmount();
  const tax = Math.floor(total * rate / (100 + rate));
  return { total, tax, base: total - tax };
}

function receiptHTML(){
  const {total,tax,base} = calc();
  const v = id => esc($(id).value.trim());
  const needStamp = base >= 50000;
  const reg = v("reg");
  return `
  <div class="top">
    <h2 class="title">領収書</h2>
    <div class="meta">No. ${v("no")}<br>発行日 ${jpDate($("date").value)}</div>
  </div>
  <div class="to"><span class="name">${v("to") || "&nbsp;"}</span><span class="hon">${esc($("hon").value)}</span></div>
  <div class="amt"><span class="k">金額</span><span class="v">¥${yen(total)}-</span></div>
  <div class="tadashi"><span>但し</span><span>${v("memo")}</span></div>
  <div class="ack">上記正に領収いたしました</div>
  <div class="bottom">
    <div>
      <table class="breakdown">
        <tr><th>${rate}%対象（税抜）</th><td>¥${yen(base)}</td></tr>
        <tr><th>消費税（${rate}%）</th><td>¥${yen(tax)}</td></tr>
      </table>
      <div class="pay">お支払方法：${v("pay")}${rate===8?"　※軽減税率対象":""}</div>
    </div>
    ${needStamp ? `<div class="stamp">収入<br>印紙</div>` : ""}
    <div class="issuer">
      <div class="shop">${v("shop")}</div>
      ${v("addr") ? `<div>${v("addr")}</div>` : ""}
      ${v("tel") ? `<div>TEL ${v("tel")}</div>` : ""}
      ${reg ? `<div>登録番号 ${reg}</div>` : ""}
      ${$("sealOn").checked && v("sealText") ? `<div class="seal">${v("sealText")}</div>` : ""}
    </div>
  </div>`;
}

function render(){
  $("receipt").innerHTML = receiptHTML();
  $("noLabel").textContent = "No. " + $("no").value;
  const {base} = calc();
  const h = $("stampHint");
  if (base >= 50000){ h.textContent = "税抜5万円以上なので収入印紙（200円〜）が必要です。印紙欄を入れています。"; h.className="hint warn"; }
  else { h.textContent = "税込金額から内税で自動計算します。"; h.className="hint"; }
  const iss = {}; ISSUER.forEach(k => iss[k] = $(k).value); iss.sealOn = $("sealOn").checked;
  store.set("issuer", iss);
  fit();
}

function fit(){
  const stage = $("stage"), sc = $("scaler");
  const w = stage.clientWidth - 36;
  const s = Math.min(1, w / 760);
  sc.style.transform = `scale(${s})`;
  sc.style.height = (470 * s) + "px";
}

$("f").addEventListener("input", render);
$("f").addEventListener("change", render);
$("f").addEventListener("submit", e => e.preventDefault());
$("rateSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  rate = Number(b.dataset.rate);
  $("rateSeg").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x===b));
  render();
});
$("memoChips").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  $("memo").value = b.textContent; render();
});
$("amount").addEventListener("blur", () => { const n=parseAmount(); $("amount").value = n ? yen(n) : ""; });
$("nextNo").addEventListener("click", () => {
  const n = (parseInt($("no").value,10)||0);
  store.set("lastNo", n);
  $("no").value = String(n+1).padStart(4,"0");
  render(); status(`No.${String(n).padStart(4,"0")} を使用済みにしました`);
});
window.addEventListener("resize", fit);

function status(t){ $("status").textContent = t; }

async function snapshot(){
  await (document.fonts ? document.fonts.ready : Promise.resolve());
  const cap = $("capture");
  cap.innerHTML = `<div class="receipt">${receiptHTML()}</div>`;
  const canvas = await html2canvas(cap.firstElementChild, {scale:3, backgroundColor:"#fffefb", logging:false});
  cap.innerHTML = "";
  return canvas;
}
function fileBase(){ return `領収書_${$("no").value}_${$("date").value}`; }

let pending = null; // {blob, filename}

function deliver(blob, filename, canvas){
  pending = { blob, filename };
  const url = URL.createObjectURL(blob);
  const a = $("dlLink"); a.href = url; a.download = filename;
  $("modalImg").src = canvas.toDataURL("image/png");
  const file = new File([blob], filename, { type: blob.type });
  const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
  $("shareBtn").hidden = !canShare;
  $("modalHint").textContent = canShare
    ? "できました。「共有・保存」から「ファイルに保存」やLINE・メールに送れます。"
    : "できました。「ダウンロード」で保存してください。";
  $("modal").hidden = false;
  status(filename + " を作成しました");
}
$("shareBtn").addEventListener("click", async () => {
  if (!pending) return;
  const file = new File([pending.blob], pending.filename, { type: pending.blob.type });
  try { await navigator.share({ files: [file], title: pending.filename }); status(pending.filename + " を共有しました"); }
  catch(e){ if (e && e.name !== "AbortError") status("共有できませんでした。ダウンロードを使ってください"); }
});

async function run(kind){
  const btns = [$("savePdf"),$("savePng")]; btns.forEach(b=>b.disabled=true);
  status("作成中…");
  try{
    const canvas = await snapshot();
    if (kind === "png"){
      const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
      deliver(blob, fileBase()+".png", canvas);
    } else {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({orientation:"landscape", unit:"mm", format:"a5"}); // 210x148
      const mw = 190, mh = mw * 470/760;
      pdf.addImage(canvas.toDataURL("image/jpeg", 0.95), "JPEG", 10, (148-mh)/2, mw, mh);
      deliver(pdf.output("blob"), fileBase()+".pdf", canvas);
    }
  } catch(e){ status("作成に失敗しました：" + (e && e.message ? e.message : e)); }
  btns.forEach(b=>b.disabled=false);
}
$("savePdf").addEventListener("click", () => run("pdf"));
$("savePng").addEventListener("click", () => run("png"));
$("closeModal").addEventListener("click", () => { $("modal").hidden = true; });

$("amount").value = yen(parseAmount());
render();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
